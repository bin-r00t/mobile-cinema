# The library on the machine the phone drive is mounted on.
#
#   MOVIE_ROOT=/mnt/phone/Movies docker compose up
#
# The phone drive is mounted read only into the api container: the server
# only reads the movies, the catalog and the converted files live on a
# volume of their own.

services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: mobile-cinema-api
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      # Where the movies are inside the container.
      MOVIE_ROOT: /movies
      DB_PATH: /data/catalog.sqlite
      CACHE_DIR: /data/cache
      FFPROBE_PATH: /usr/bin/ffprobe
      FFMPEG_PATH: /usr/bin/ffmpeg
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The phone drive of the host. It is only read.
      - ${MOVIE_ROOT:-./movies}:/movies:ro
      # The catalog and the converted subtitles.
      - catalog:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: mobile-cinema-web
    ports:
      # The address the player is reached at: http://<host>:8080
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  catalog:
