# nginx serves the player and hands the API over to the server.
#
# The browser only ever talks to one address: the files of the app come
# from nginx, everything under /api goes to the server. The movies are
# never proxied as files — they are streamed by the server itself, which
# knows the catalog and the path safety rules.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The files of the app. The router of the player lives in the browser,
    # so a page that does not exist on disk is the app itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API: the catalog, the scan, the streams and the subtitles.
    location /api/ {
        proxy_pass http://api:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The progressive stream asks for a range of bytes; it has to
        # reach the server untouched.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # A movie is a long answer: it is passed through as it comes.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The player is small, but the movies are not: let them through.
    client_max_body_size 0;
}
